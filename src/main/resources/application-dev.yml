spring:
  flyway:
    enabled: true
    baseline-on-migrate: true
  datasource:
    url: jdbc:postgresql://db:5432/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # 2코어 환경 최적 수치: (core_count * 2) + effective_spindle_count
      # 28ms의 빠른 로직이므로 20~25개면 초당 수천 건의 쿼리 처리가 가능.
      maximum-pool-size: 25
      # 풀에 여유가 없을 때 대기하는 시간 (3초 이상 넘어가면 서버 부하로 판단)
      connection-timeout: 3000
      # 유휴 커넥션 유지 시간
      idle-timeout: 600000
      # 커넥션 최대 생존 시간 (DB 서버 설정보다 약간 짧게)
      max-lifetime: 1800000
      # 최소 유휴 커넥션 (보통 max와 동일하게 가져가서 풀 출렁임을 방지함)
      minimum-idle: 25
      # 성능 모니터링을 위한 풀 이름
      pool-name: HikariPool-Chat
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  thymeleaf:
    encoding: UTF-8
    prefix: classpath:/templates/
    suffix: .html
    check-template-location: true
  mail:
    host: ${GOOGLE_MAIL_HOST}
    port: 587
    username: ${GOOGLE_EMAIL}
    password: ${GOOGLE_EMAIL_PASSWORD}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true     # ★ 587 필수
      mail.smtp.starttls.required: true
      mail.smtp.ssl.enable: false
      mail.smtp.ssl.trust: smtp.gmail.com
      mail.smtp.ssl.protocols: TLSv1.2
      mail.debug: false
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
      mail.smtp.quitwait: false

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}
      password: ${SPRING_DATA_REDIS_PASSWORD}
      key:
        prefix:
          refreshToken: "refreshToken:"
          blacklist: "blacklist:"
          accessToken: "access_token"
      repositories:
        enabled: false
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 100800
  refresh-expiration: 100800

cloud:
  openfeign:
    client:
      config:
        default:
          connectTimeout: ${FEIGN_CONNECT_TIMEOUT}
          readTimeout: ${FEIGN_READ_TIMEOUT}
          loggerLevel: ${FEIGN_LOGGER_LEVEL}

oauth:
  google:
    android:
      client-id: ${ANDROID_CLIENT_ID}
      redirect-uri: ${ANDROID_REDIRECT_URI}
    ios:
      client-id: ${IOS_CLIENT_ID}
      redirect-uri: ${IOS_REDIRECT_URI}
    web:
      client-id: ${WEB_CLIENT_ID}
      client-secret: ${WEB_CLIENT_SECRET}
      redirect-uri: ${WEB_REDIRECT_URI}

  apple:
    issuer: https://appleid.apple.com
    team-id: ${APPLE_TEAM_ID}
    app-bundle-id: ${APPLE_APP_BUNDLE_ID}
    key-id: ${APPLE_KEY_ID}
    client-id: ${APPLE_CLIENT_ID}
    redirect-uri: ${APPLE_REDIRECT_URI}
    private-key-pem: ${APPLE_PRIVATE_KEY_PEM}

ncp:
  s3:
    access-key: ${NCP_ACCESS_KEY}
    secret-key: ${NCP_SECRET_KEY}
    region: kr-standard
    endpoint: https://kr.object.ncloudstorage.com
    bucket: ${NCP_BUCKET_NAME}
  clova:
    apiUrl: https://clovastudio.stream.ntruss.com/testapp/v1/chat-completions/HCX-003
    apiKey: ${CLOVA_STUDIO_API_KEY}

swagger:
  server-url: ${SWAGGER_URL}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}

google:
  cloud:
    project:
      id: ${GCP_PROJECT_ID}
    perspective:
      api-key: ${GCP_PERSPECTIVE_API_KEY}
  maps:
    api:
      key: ${GCP_MAP_API_KEY}

logging:
  level:
    root: WARN
    # 프레임워크 소음 차단
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
    org.springframework.web: INFO
    org.springframework.http.converter: INFO

    # WebSocket/메시징은 운영에서 WARN 이상
    org.springframework.web.socket: WARN
    org.springframework.messaging: WARN
    org.apache.tomcat.websocket: WARN

    # 애플리케이션 커스텀 로거(운영 기본 INFO)
    core: INFO
    core.global.config.core.global.security.JwtTokenFilter: INFO
    core.global.search: INFO

# 운영에서는 에러 본문 노출 금지
server.error.include-message: always
server.error.include-binding-errors: always

app:
  mail:
    from: ${NAVER_HOST}
    brand: ${APP_NAME}
    code-ttl-minutes: 3
  password:
    reset:
      ttl-minutes: 15
      session-ttl-minutes: 5

  api:
    base-url: ${BASE_URL}

cdn:
  base-url: ${NCP_CDN_URL}

firebase:
  credentials:
    json-string: ${FIREBASE_CREDENTIALS_JSON}

management:
  health:
    mail:
      enabled: true # 수동 체크를 위해 켜둠
  endpoints:
    web:
      exposure:
        include: prometheus, health, metrics, info, loggers
  endpoint:
    health:
      cache:
        time-to-live: 1m
      show-components: always
      show-details: when-authorized # 기본 경로는 상세 정보 숨김
      group:
        liveness:
          exclude: mail
        readiness:
          exclude: mail
        manual-check: # Smoke Test용 경로
          include: mail
          show-details: always

  metrics:
    tags:
      application: my-service
      app: social-chat
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true

  prometheus:
    metrics:
      export:
        enabled: true

resilience4j:
  circuitbreaker:
    instances:
      translationApi: # 서킷 브레이커 이름
        registerHealthIndicator: true
        slidingWindowSize: 10              # 최근 10개의 요청을 기준으로 판단
        failureRateThreshold: 50           # 에러율이 50% 이상이면 Open
        waitDurationInOpenState: 10s       # Open 상태에서 10초 대기 후 Half-Open으로 전환
        slowCallDurationThreshold: 2s      # 2초 이상 걸리면 느린 호출로 간주
        slowCallRateThreshold: 100         # 느린 호출이 100%면 Open
        permittedNumberOfCallsInHalfOpenState: 3 # Half-Open 상태에서 3번 시도해보고 복구 결정
        slidingWindowType: COUNT_BASED
iap:
  android:
    packageName: ${APP_PACKAGE_NAME}
    serviceAccountJsonBase64: ${IAP_ANDROID_SA_B64}
  ios:
    issuerId: ${IAP_IOS_ISSUER_ID}
    keyId: ${IAP_IOS_KEY_ID}
    privateKeyBase64: ${IAP_IOS_P8_B64}
    bundleId: your.ios.bundle
    environment: Production

sightengine:
  api-user: ${SIGHTENGINE_API_USER}
  api-secret: ${SIGHTENGINE_API_SECRET}

smoke:
  enabled: true
  token: ${SMOKE_TOKEN:}
  base-url: ${SMOKE_BASE_URL:http://localhost:8080}
  admin:
    email: ${SMOKE_ADMIN_EMAIL}
    password: ${SMOKE_ADMIN_PW}
    login-path: ${SMOKE_ADMIN_LOGIN_URL}
  gate:
    - name: health
      type: "HEALTH"
      method: GET
      path: /actuator/health/liveness
      expected-status: 200

  full:
    # --- [2] 정적/기본 정보 조회 (네트워크 및 캐시 확인) ---
    - name: "My-Page-Support-Links"
      type: "INTERNAL"
      method: "GET"
      path: "/api/v1/mypage/support-links"
      expectedStatus: 200

    # --- [3] 주요 데이터 조회 (DB 연결성 확인) ---
    - name: "Get-User-Profile"
      type: "INTERNAL"
      method: "GET"
      path: "/api/v1/member/infos?userIds=1098"
      expectedStatus: 200

    - name: "Get-Follow-Lists"
      type: "INTERNAL"
      method: "GET"
      path: "/api/v1/mypage/follows?status=PENDING"
      expectedStatus: 200

    - name: "Get-Post-Lists"
      type: "INTERNAL"
      method: "GET"
      path: "/api/v1/boards/1/posts" # 존재하는 ID 가정
      expectedStatus: 200

    - name: "Get-Post-Comments-Sample"
      type: "INTERNAL"
      method: "GET"
      path: "/api/v1/posts/1/comments" # 존재하는 ID 가정
      expectedStatus: 200

    - name: "Get-My-Posts"
      type: "INTERNAL"
      method: "GET"
      path: "/api/v1/my/posts?size=20"
      expectedStatus: 200

    - name: "Get-My-Bookmarks"
      type: "INTERNAL"
      method: "GET"
      path: "/api/v1/my/bookmarks?size=20"
      expectedStatus: 200

    - name: "Get-Search-Posts"
      type: "INTERNAL"
      method: "GET"
      path: "/api/v1/search/1/posts?q=hi"
      expectedStatus: 200

    - name: "Get-Chat-Rooms-My-List"
      type: "INTERNAL"
      method: "GET"
      path: "/api/v1/chat/rooms"
      expectedStatus: 200

    - name: "Friend-Recommend-Logic"
      type: "INTERNAL"
      method: "GET"
      path: "/api/v1/commend/content-based"
      expectedStatus: 200

    # --- [5] 관리자/내부 도구 확인 ---
    - name: "Admin-User-Basic-Info"
      type: "ADMIN"
      method: "GET"
      path: "/api/admin/users/1/basic"
      expectedStatus: 200

    # --- 외부 의존성 확인 ---
    # --- [1] 인프라 생존 확인 (Actuator) ---
    - name: "Infra-Redis-Health"
      type: "INTERNAL"
      method: "GET"
      path: "/actuator/health/redis"
      expectedStatus: 200

    - name: "Infra-Google-Mail-SMTP"
      type: "INTERNAL"
      method: "GET"
      path: "/actuator/health/manual-check"
      expectedStatus: 200

    # --- [2] NCP (Naver Cloud Platform) 의존성 ---
    - name: "Ext-NCP-Object-Storage"
      type: "EXTERNAL"
      method: "GET"
      path: "${ncp.s3.end-point}/${NCP_BUCKET_NAME}" # S3Config의 endpoint 주소
      expectedStatus: 200 # 인증 실패 시 403이 올 수 있으나 통로 확인용

    # 구글 번역 서비스 탐색 경로 (200 보장)
    - name: "Ext-Google-Translate-API"
      type: "EXTERNAL"
      method: "GET"
      path: "https://translation.googleapis.com/language/translate/v2?key=${GCP_MAP_API_KEY}&q=hi&target=ko"
      expectedStatus: 200

    # --- [3] 소셜 인증 및 푸시 (Auth & Firebase) ---
    - name: "Deep-Check-Google-Secret"
      type: "LOGIN"
      method: "GET"
      path: "/api/v1/admin/health-check/debug/oauth/google"
      expectedStatus: 200
    - name: "Deep-Check-Apple-Secret"
      type: "LOGIN"
      method: "GET"
      path: "/api/v1/admin/health-check/debug/oauth/apple"
      expectedStatus: 200

    - name: "Ext-Firebase-FCM"
      type: "EXTERNAL"
      method: "GET"
      path: "https://fcm.googleapis.com/$discovery/rest?version=v1"
      expectedStatus: 200

    - name: "Ext-Google-MAPS-API"
      type: "EXTERNAL"
      method: "GET"
      path: "https://maps.googleapis.com/maps/api/geocode/json?address=seoul&key=${GCP_MAP_API_KEY}"
      expectedStatus: 200

    # --- [4] 기타 인프라 체크 ---
    - name: "Infra-WebSocket-Endpoint"
      type: "INTERNAL"
      path: "/ws"
      method: "GET"
      expectedStatus: 200


openai:
  api-key: ${OPEN_AI_KEY}

otp:
  magic-code-enabled: true
  admin-secret: ${ADMIN_OTP_SECRET}


encryption:
  secret: ${ENCRYPTION_SECRET}

server:
  tomcat:
    threads:
      # 핵심: 2코어 서버에서 200개는 너무 많습니다.
      # 100개로 줄여서 CPU 경합을 방지하고 개별 처리 속도를 높입니다.
      max: 100
      # 최소한으로 유지할 스레드 수
      min-spare: 20
    # 접속을 허용할 최대 연결 수 (스레드 수보다 넉넉하게 잡음)
    max-connections: 2000
    # OS 수준에서 대기시킬 요청 수 (대기실 크기)
    accept-count: 100
    # 요청 처리 타임아웃 (무한 대기 방지)
    connection-timeout: 20000

image:
  cleanup:
    retry:
      fixed-delay: PT5M
      initial-delay: PT1M
